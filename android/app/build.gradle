apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native configuration
}

def enableProguardInReleaseBuilds = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "de.openeos.tv"

    defaultConfig {
        applicationId "de.openeos.tv"
        minSdkVersion 21
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('OPENEOS_UPLOAD_STORE_FILE')) {
                storeFile file(OPENEOS_UPLOAD_STORE_FILE)
                storePassword OPENEOS_UPLOAD_STORE_PASSWORD
                keyAlias OPENEOS_UPLOAD_KEY_ALIAS
                keyPassword OPENEOS_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Was hardcoded to signingConfigs.debug regardless of whether a
            // real release keystore was configured above — every "release"
            // build (including tagged GitHub releases) shipped signed with
            // the throwaway debug key, password 'android'/'android'. Now
            // uses the real release config when it's actually configured,
            // and falls back to debug signing (loudly, see below) only when
            // it isn't — e.g. a contributor building locally without the
            // upload keystore.
            signingConfig project.hasProperty('OPENEOS_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

if (!project.hasProperty('OPENEOS_UPLOAD_STORE_FILE')) {
    logger.warn(
        'WARNING: OPENEOS_UPLOAD_STORE_FILE is not set — the "release" build ' +
        'type will be signed with the DEBUG keystore (password android/android). ' +
        'This APK is not suitable for distribution. Set OPENEOS_UPLOAD_STORE_FILE, ' +
        'OPENEOS_UPLOAD_STORE_PASSWORD, OPENEOS_UPLOAD_KEY_ALIAS, and ' +
        'OPENEOS_UPLOAD_KEY_PASSWORD (e.g. in ~/.gradle/gradle.properties or as ' +
        'CI secrets) to sign with the real release key.'
    )
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // TV Leanback library
    implementation "androidx.leanback:leanback:1.0.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
